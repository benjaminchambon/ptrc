<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <meta name="robots" content="noindex,nofollow"/>
  <title>PTRC Admin — Connexion</title>
  <link href="../favicon.ico" rel="icon" sizes="any"/>
  <link href="admin.css" rel="stylesheet"/>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-header">
      <a class="admin-brand" href="../index.html"><img src="../logo-paris-tag-rugby.png" alt="Paris Tag Rugby Club"/><span>PTRC <strong>Admin</strong></span></a>
    </header>

    <section class="admin-login" id="login-panel">
      <div class="admin-login-card">
        <span class="admin-eyebrow">Administration</span>
        <h1>Connexion</h1>
        <p>Connecte-toi pour consulter les statistiques et gérer les actualités du PTRC.</p>
        <form id="login-form">
          <label>Email<input autocomplete="username" id="login-email" type="email" required/></label>
          <label>Mot de passe<input autocomplete="current-password" id="login-password" type="password" required/></label>
          <button class="admin-primary" id="login-submit" type="submit">Se connecter</button>
          <p class="admin-error" id="login-error" role="alert"></p>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="login.js"></script>
</body>
</html>
